services:
  # ============================================================
  # SOURCE : PostgreSQL (base OLTP simulée du site ShopNova)
  # ============================================================
  postgres:
    image: postgres:16
    container_name: shopnova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./source/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shopnova-net

  # ============================================================
  # INGESTION : Kafka (KRaft, sans Zookeeper)
  # ============================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: shopnova-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - shopnova-net

  # ============================================================
  # INGESTION : Kafka Connect + plugin Debezium
  # ============================================================
  kafka-connect:
    image: quay.io/debezium/connect:2.7.3.Final 
    container_name: shopnova-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: shopnova-connect-group
      CONFIG_STORAGE_TOPIC: shopnova_connect_configs
      OFFSET_STORAGE_TOPIC: shopnova_connect_offsets
      STATUS_STORAGE_TOPIC: shopnova_connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    networks:
      - shopnova-net

  # ============================================================
  # INGESTION : Kafka UI (démonstration des messages CDC)
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shopnova-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: shopnova
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "${KAFKA_UI_PORT}:8080"
    networks:
      - shopnova-net

  # ============================================================
  # BRONZE : MinIO (stockage objet S3-compatible)
  # ============================================================
  minio:
    image: onyxdotapp/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    container_name: shopnova-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shopnova-net

  # ============================================================
  # SILVER : Initialisation MinIO + Spark Iceberg
  # ============================================================
  minio-init:
    image: pgsty/mc:latest
    container_name: shopnova-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb -p local/warehouse || true;
      mc mb -p local/bronze    || true;
      echo 'MinIO init OK';
      exit 0;"
    networks:
      - shopnova-net

  spark-iceberg:
    image: tabulario/spark-iceberg:3.5.1_1.5.0
    container_name: shopnova-spark
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID:     ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION:            us-east-1
    volumes:
      - ./silver:/opt/silver
      - ./source:/opt/source
      - ./gold:/opt/gold    
    ports:
      - "8081:8080"   # UI Spark
      - "8888:8888"   # Jupyter
      - "10000:10000" # Thrift server
    networks:
      - shopnova-net

  # ============================================================
  # PRÉSENTATION : Metabase (Dashboard)
  # ============================================================
  metabase:
    image: adamjsturge/metabase-duckdb:latest
    container_name: shopnova-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
       - ./shopnova_gold.duckdb:/data/shopnova_gold.duckdb
    networks:
      - shopnova-net

# ============================================================
# VOLUMES PERSISTANTS
# ============================================================
volumes:
  postgres_data:
  kafka_data:
  minio_data:

# ============================================================
# RÉSEAU COMMUN
# ============================================================
networks:
  shopnova-net:
    driver: bridge