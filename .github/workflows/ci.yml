name: CI ShopNova — Bronze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: |
          python -m py_compile source/simulateur.py ingestion/bronze_writer.py

      - name: Vérifier la validité du docker-compose
        run: |
          docker compose config > /dev/null
  silver-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pyspark==3.5.1 pytest
      - name: Run Silver unit tests
        run: |
          cd silver
          pytest tests/ -v